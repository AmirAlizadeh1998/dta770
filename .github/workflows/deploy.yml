name: Deploy Go-React App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Build React Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: 🚚 Copy dist to Go backend
        run: |
          rm -rf backend/cmd/api/dist
          cp -r frontend/dist backend/cmd/api/

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: 🏗️ Build Go Backend
        working-directory: ./backend
        run: GOOS=linux GOARCH=amd64 go build -o dta770 ./cmd/api

      - name: 🚀 Copy Binary to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/dta770"
          target: "/opt/dta770/"
          strip_components: 1
          overwrite: true

      - name: 🔄 Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo chmod +x /opt/dta770/dta770
            sudo systemctl restart dta770